name: public-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    name: public-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: No secrets anywhere in history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
      - name: No emails, client names, or private names (blocklist from secret)
        env:
          PUBLIC_BLOCKLIST: ${{ secrets.PUBLIC_BLOCKLIST }}
        run: |
          rm -f gitleaks
          node scripts/ci/check-public-safety.mjs ${{ github.event.pull_request.base.sha }}
