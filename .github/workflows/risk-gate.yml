name: risk-gate

# Runs the gate from the BASE branch code (never the PR's code) and posts the "risk-gate" commit status.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  checks: read

concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: risk-gate-evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/ci/pr-gate.mjs risk-gate ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASEN_HUMAN: ${{ vars.ASEN_HUMAN || 'creativeasen' }}
          ASEN_BOT: ${{ vars.ASEN_BOT || 'asenbot' }}
