name: auto-merge

# When CI or the risk gate finishes for a PR, merge it if every rule in policy/risk-tiers.md is met, then tag the merge.
# risk-gate is included so a late `ai-verified` label or a late human approval also leads to a merge (pr-gate re-checks everything).
on:
  workflow_run:
    workflows: [repo-ci, public-safety, risk-gate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: read
  checks: read

jobs:
  merge:
    name: auto-merge
    if: contains(fromJSON('["pull_request","pull_request_target","pull_request_review"]'), github.event.workflow_run.event) && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/ci/pr-gate.mjs automerge ${{ github.event.workflow_run.head_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASEN_HUMAN: ${{ vars.ASEN_HUMAN || 'creativeasen' }}
          ASEN_BOT: ${{ vars.ASEN_BOT || 'asenbot' }}
